[project]
site_name = "S3FS NIO"
site_url = "https://s3fs-nio.carlspring.org/"
repo_url = "https://github.com/carlspring/s3fs-nio"
edit_uri = "edit/master/docs/content/"
docs_dir = "content"

extra_css = [
  "assets/custom.css",
  "assets/structor-menu.css",
]

nav = [
  { "Home" = [
    { "Getting Started" = "index.md" },
    { "History" = "history.md" },
    { "Versioning and Releases" = "versioning.md" },
    { "License" = "license.md" },
  ] },
  { "Contributing" = [
    { "Getting Started" = "contributing/index.md" },
    { "Code of Conduct" = "contributing/code-of-conduct.md" },
    { "Coding Conventions" = "contributing/developer-guide/coding-convention.md" },
    { "Guides" = [
      { "Developers" = "contributing/developer-guide/index.md" },
      { "Security Advisers" = "contributing/security-advisers.md" },
      { "Writing Documentation" = "contributing/writing-documentation.md" },
    ] },
    { "Legal" = [
      { "Overview" = "contributing/legal/index.md" },
      { "Licenses" = [
        { "Apache 2.0" = "contributing/legal/license-Apache-2.0.md" },
        { "MIT" = "contributing/legal/license-MIT.md" },
      ] },
      { "ICLA" = "contributing/legal/ICLA.md" },
    ] },
    { "Pull Request Guidelines" = "contributing/pull-request-guidelines.md" },
    { "Who Can Help And How" = "contributing/who-can-help-and-how.md" },
  ] },
  { "Reference" = [
    { "Configuration Options" = "reference/configuration-options.md" },
    { "Examples" = [
      { "Basic Example" = "reference/examples/basic-example.md" },
      { "MINA Example" = "reference/examples/mina-example.md" },
      { "Spring Example" = "reference/examples/spring-example.md" },
    ] },
  ] },
  { "Join chat" = [
    { "Redirect" = "chat.md" },
  ] },
]

# Variables available in Markdown pages via {{ variable }} (see markdownextradata below).
[project.extra]
project_name = "S3FS NIO"
repo_url = "https://github.com/carlspring/s3fs-nio"
chat_url = "https://chat.carlspring.org/channel/s3fs-nio-community"
assetsPath = "/assets"
resourcesPath = "/assets/resources"
POM_GROUP_ID = "org.carlspring.cloud.aws"
POM_ARTIFACT_ID = "s3fs-nio"
## {x-release-please-start-version}
POM_VERSION = "3.0.1-SNAPSHOT"
## {x-release-please-end}

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/carlspring/s3fs-nio"

[[project.extra.social]]
icon = "fontawesome/brands/rocketchat"
link = "https://chat.carlspring.org/channel/s3fs-nio-community"

[project.theme]
variant = "classic"
custom_dir = "theme"
language = "en"
features = [
  "announce.dismiss",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

# Dark mode is the default: the first palette entry is used unless the reader
# has toggled to light mode.
[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
meta = {}
md_in_html = {}
mdx_gh_links = {}
mdx_include.base_path = "./content"
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.critic = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.user = "carlspring"
pymdownx.magiclink.repo = "s3fs-nio"
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.check_paths = true
pymdownx.snippets.restrict_base_path = false
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
tables = {}
# Renders {{ variable }} placeholders from [project.extra] (replaces the markdownextradata MkDocs plugin).
"zensical.extensions.markdownextradata" = {}
