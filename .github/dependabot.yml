# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/" # Location of package manifests
    schedule:
      # Check for updates to Gradle dependencies every day
      interval: "daily"
    commit-message:
      prefix: deps(upgrade)
    groups:
      # AWS SDK artifacts are released together and share a version via the BOM.
      aws:
        patterns:
          - "software.amazon.awssdk:*"
      # Google libraries (Guava, FindBugs annotations).
      google:
        patterns:
          - "com.google.guava:*"
          - "com.google.code.findbugs:*"
      # JUnit artifacts share a version and must be upgraded together.
      junit:
        patterns:
          - "org.junit.jupiter:*"
      # Mockito artifacts share a version and must be upgraded together.
      mockito:
        patterns:
          - "org.mockito:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every day
      interval: "daily"
    commit-message:
      prefix: deps(upgrade)
    groups:
      # Official GitHub-maintained actions.
      github-actions:
        patterns:
          - "actions/*"
          - "github/codeql-action/*"
      # Actions maintained by peter-evans.
      peter-evans:
        patterns:
          - "peter-evans/*"
      # Gradle-maintained actions.
      gradle:
        patterns:
          - "gradle/actions/*"
